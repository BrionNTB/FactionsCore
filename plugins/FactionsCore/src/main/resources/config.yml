# FactionsCore configuration

storage:
  # sqlite (bundled, zero setup) is the only backend implemented right now.
  type: sqlite
  file: factionscore.db

factions:
  power:
    starting: 10.0
    max-per-member: 10.0
    regen-per-hour: 1.0
    loss-per-death: 4.0
  claims:
    chunk-cost: 1.0        # power cost per claimed chunk
    min-distance-from-other-faction: 1  # chunks, buffer/DTR-less "border" gap
    protect-build: true
    protect-pvp-in-safezone: true
  home:
    teleport-delay-seconds: 3
    cancel-on-move: true
  raidable:
    enabled: true
    dtr-loss-opens-raid: false   # this engine doesn't track DTR, power<=0 is used instead
  value:
    # "Faction value" is a wealth score separate from power: it's what /f value and /f top
    # rank factions by. Stacking a spawner increases its contribution proportionally, same as a
    # stacked spawner is worth more (it produces more).
    land-per-claim: 500
    spawner-value: 5000

combat:
  # Bedrock never implemented the Java 1.9+ attack-cooldown/"sword sweep" system,
  # so combat here is already closer to Java 1.8.8 by default. These let owners
  # tune it further to match 1.8 PvP feel exactly.
  legacy-knockback: true
  base-horizontal-knockback: 0.4
  base-vertical-knockback: 0.4
  sprint-reset-on-hit: true
  critical-hit:
    enabled: true
    multiplier: 1.5
    requires-falling: true

enchants:
  # CosmicPvP-style custom enchants layered on top of vanilla enchanting.
  max-custom-enchants-per-item: 3
  enabled:
    - stun
    - tornado
    - leech
    - blaze
    - spring
    - haste
    - escape
    - lightning
    - gravity
    - webber
    - protection
    - sharpness
  apply:
    # Drag the enchant book directly onto the target item in your own inventory -- no anvil.
    # Base success chance per book level (index 0 = level 1); levels beyond the list reuse the
    # last entry. Dragging a stack of 2+ of the same book consumes 2 and applies the "combined"
    # chance instead of the base one for that level.
    base-success-chance: [0.90, 0.80, 0.70, 0.55, 0.40, 0.25]
    combined-success-chance: [0.98, 0.92, 0.85, 0.75, 0.60, 0.45]
    # Player (XP) level required to even attempt a book of this enchant level; index 0 = level 1.
    required-player-level: [0, 0, 5, 10, 20, 30]
    fail-damage: 4.0

anticheat:
  enabled: true
  autoclicker:
    enabled: true
    sample-size: 20          # clicks per rolling window
    max-cps: 20
    flag-cps: 14
    max-variance-below: 4.5  # ms stddev between clicks; too-consistent => flag
    ban-after-flags: 6
  xray:
    enabled: true
    track-ores:
      - diamond_ore
      - deepslate_diamond_ore
      - ancient_debris
      - emerald_ore
      - deepslate_emerald_ore
    suspicion-window-minutes: 30
    flag-threshold: 5         # "straight-lined to ore in the dark" events per window
    notify-staff: true
  aim:
    enabled: true
    max-snap-angle-degrees: 60     # single-tick yaw/pitch delta considered humanly implausible
    min-humanlike-jitter: 0.02     # near-zero variance in aim deltas over a window => flag
    sample-size: 40
    flag-threshold: 8
  reach:
    enabled: true
    max-blocks: 3.25   # vanilla melee reach is ~3.0; small allowance for network/lag-compensation slack
  punishment:
    flags-to-warn: 3
    flags-to-kick: 8
    flags-to-ban: 15
    ban-duration-hours: 72

stacking:
  mobs:
    enabled: true
    radius: 4.0
    max-stack-size: 64
    excluded:
      - wither
      - ender_dragon
      - warden
    scale-loot: true
    scale-xp: true
  spawners:
    enabled: true
    max-stack-size: 64
    mobs-per-spawn-scaling: true

updater:
  enabled: true
  check-interval-minutes: 60
  channel: stable
  auto-apply: false   # if true, downloads + swaps jar and requests a restart
  repo: PowerNukkitX/PowerNukkitX
  jar-name: server.jar   # filename of the running server jar, relative to the working directory

border:
  enabled: true
  radius:
    overworld: 60000
    nether: 60000
    end: 60000
  warning-distance: 50       # blocks from the border where the visual wall/popup starts showing
  check-interval-seconds: 5  # sweep interval that recovers players who got past the border via non-movement means
  wall:
    enabled: true
    patch-radius: 8    # how wide (blocks) the rendered particle patch is, centered on the player
    spacing: 2         # blocks between particles; higher = fewer particles = cheaper

combatlog:
  enabled: true
  tag-duration-seconds: 10
  block-teleport: true

buycraft:
  enabled: false
  # Tebex/Buycraft "Command Queue" API secret, from the store's Server settings.
  secret-key: ""
  poll-interval-seconds: 60

wild:
  cooldown-seconds: 60
  min-radius: 500
  max-radius: 10000

kits:
  starter:
    cooldown-hours: 24
    permission: ""     # empty = everyone can claim
    items:
      - {id: minecraft:stone_sword, count: 1}
      - {id: minecraft:stone_pickaxe, count: 1}
      - {id: minecraft:bread, count: 16}
      - {id: minecraft:leather_chestplate, count: 1}
  pvp:
    cooldown-hours: 48
    permission: factionscore.kit.pvp
    items:
      - {id: minecraft:iron_sword, count: 1}
      - {id: minecraft:iron_chestplate, count: 1}
      - {id: minecraft:iron_leggings, count: 1}
      - {id: minecraft:golden_apple, count: 4}

koth:
  capture-seconds: 300      # uncontested hold time to win
  reward-money: 10000
  # Extra console commands run on win; {player} is replaced with the winner's name.
  reward-commands:
    - "crate give {player} rare 1"

envoy:
  count: 6
  despawn-minutes: 10
  auto-interval-hours: 0    # 0 = manual only (/envoy start)
  # Each chest independently rolls every entry; chance is 0..1.
  loot:
    - {id: minecraft:diamond, count: 4, chance: 0.5}
    - {id: minecraft:golden_apple, count: 3, chance: 0.6}
    - {id: minecraft:iron_ingot, count: 16, chance: 0.8}
    - {id: minecraft:tnt, count: 8, chance: 0.5}
    - {id: minecraft:ender_pearl, count: 4, chance: 0.4}
    - {id: minecraft:obsidian, count: 8, chance: 0.4}

crates:
  # One weighted reward per key. Entries are either an item (id/count) or a console command
  # with {player}; chance values are relative weights, not probabilities.
  common:
    loot:
      - {id: minecraft:iron_ingot, count: 16, chance: 30}
      - {id: minecraft:golden_apple, count: 2, chance: 20}
      - {id: minecraft:tnt, count: 16, chance: 20}
      - {id: minecraft:diamond, count: 2, chance: 10}
      - {command: "enchant givebook {player} blaze 1", chance: 10}
  rare:
    loot:
      - {id: minecraft:diamond, count: 8, chance: 30}
      - {id: minecraft:tnt, count: 64, chance: 20}
      - {command: "enchant givebook {player} lightning 1", chance: 15}
      - {command: "enchant givebook {player} sharpness 5", chance: 10}
      - {command: "sellwand {player} 25", chance: 5}
  legendary:
    loot:
      - {command: "enchant givebook {player} sharpness 6", chance: 20}
      - {command: "enchant givebook {player} protection 6", chance: 20}
      - {command: "sellwand {player} 100", chance: 15}
      - {id: minecraft:netherite_ingot, count: 2, chance: 15}
      - {id: minecraft:mob_spawner, count: 1, chance: 5}

genbuckets:
  max-length: 40        # blocks per gen
  ticks-per-block: 4    # placement speed

raid:
  obsidian-breaker:
    enabled: true
    tnt-hits: 5         # explosions near an obsidian block before it breaks
    blast-radius: 4     # how close an explosion must be to count as a hit

sell:
  demand:
    fluctuate-hours: 4
    max-swing-per-tick: 0.20   # max +/- 20% drift per fluctuation
    min-multiplier: 0.4
    max-multiplier: 1.8
  # Base $ per item before the demand multiplier. Add/remove lines freely -- /sell reads whatever
  # is here, it isn't hardcoded to this list.
  prices:
    minecraft:rotten_flesh: 0.5
    minecraft:bone: 1.0
    minecraft:string: 1.0
    minecraft:spider_eye: 1.5
    minecraft:gunpowder: 2.0
    minecraft:ender_pearl: 15.0
    minecraft:blaze_rod: 8.0
    minecraft:slime_ball: 3.0
    minecraft:leather: 2.0
    minecraft:feather: 0.5
    minecraft:egg: 0.5
    minecraft:wheat: 1.0
    minecraft:carrot: 1.0
    minecraft:potato: 1.0
    minecraft:beetroot: 1.0
    minecraft:melon_slice: 0.75
    minecraft:pumpkin: 3.0
    minecraft:sugar_cane: 1.0
    minecraft:nether_wart: 2.5
    minecraft:cocoa_beans: 1.5
