name: FactionsCore
main: net.factionscore.FactionsCorePlugin
version: "0.1.0"
api: ["3.0.0"]
author: FactionsCore
description: PvP-tuned factions gamemode for a Bedrock server engine forked and optimized for Java 1.8.8-style combat/cannoning.
website: https://github.com/brionntb/factionscore
load: POSTWORLD

commands:
  f:
    aliases: [factions, faction]
    description: Factions command
    usage: "/f help"
    permission: factionscore.command.f
  fadmin:
    description: Factions admin command
    usage: "/fadmin help"
    permission: factionscore.command.fadmin
  enchant:
    description: Apply/inspect custom enchants
    usage: "/enchant help"
    permission: factionscore.command.enchant
  stack:
    description: Mob/spawner stacking controls
    usage: "/stack help"
    permission: factionscore.command.stack
  anticheat:
    aliases: [ac]
    description: Anti-cheat inspection and management
    usage: "/anticheat help"
    permission: factionscore.command.anticheat
  worldborder:
    aliases: [wb, border]
    description: World border inspection/administration
    usage: "/worldborder help"
    permission: factionscore.command.worldborder
  shop:
    description: Teleport to the shop
    usage: "/shop"
    permission: factionscore.command.shop
  setshop:
    description: Set the shop location
    usage: "/setshop"
    permission: factionscore.command.setshop
  sell:
    description: Sell mob/crop loot
    usage: "/sell"
    permission: factionscore.command.sell
  balance:
    aliases: [bal, money]
    description: Check a balance
    usage: "/balance [player]"
    permission: factionscore.command.balance
  pay:
    description: Send money to another player
    usage: "/pay <player> <amount>"
    permission: factionscore.command.balance
  baltop:
    description: Richest players leaderboard
    usage: "/baltop"
    permission: factionscore.command.balance
  wild:
    aliases: [rtp]
    description: Random wilderness teleport
    usage: "/wild"
    permission: factionscore.command.wild
  kit:
    aliases: [kits]
    description: Claim a kit
    usage: "/kit [name]"
    permission: factionscore.command.kit
  bounty:
    description: Place or view kill bounties
    usage: "/bounty <set|list>"
    permission: factionscore.command.bounty
  koth:
    description: King of the Hill event
    usage: "/koth status"
    permission: factionscore.command.koth
  envoy:
    description: Supply-drop event administration
    usage: "/envoy <start|setcenter|clear>"
    permission: factionscore.command.envoy
  crate:
    description: Crate administration
    usage: "/crate <set|remove|give>"
    permission: factionscore.command.crate
  sellwand:
    description: Give a sell wand
    usage: "/sellwand <player> [uses]"
    permission: factionscore.command.sellwand

permissions:
  factionscore.command.f:
    description: Use faction commands
    default: true
  factionscore.command.fadmin:
    description: Use faction admin commands
    default: op
  factionscore.command.enchant:
    description: Use custom enchant commands
    default: op
  factionscore.command.stack:
    description: Use mob/spawner stacking commands
    default: op
  factionscore.command.anticheat:
    description: Use anti-cheat commands
    default: op
  factionscore.bypass.anticheat:
    description: Exempt a player from anti-cheat flags
    default: op
  factionscore.bypass.claims:
    description: Bypass faction land protection
    default: op
  factionscore.bypass.combatlog:
    description: Exempt a player from the combat-log kill/teleport-block
    default: op
  factionscore.bypass.border:
    description: Exempt a player from world border enforcement
    default: op
  factionscore.command.worldborder:
    description: Inspect/administer the world border
    default: op
  factionscore.command.shop:
    description: Teleport to the shop
    default: true
  factionscore.command.setshop:
    description: Set the shop location
    default: op
  factionscore.command.sell:
    description: Open the sell shop
    default: true
  factionscore.command.balance:
    description: Use /balance, /pay and /baltop
    default: true
  factionscore.command.wild:
    description: Use /wild
    default: true
  factionscore.command.kit:
    description: Use /kit
    default: true
  factionscore.command.bounty:
    description: Use /bounty
    default: true
  factionscore.command.koth:
    description: View KOTH status
    default: true
  factionscore.command.kothadmin:
    description: Start/stop/configure KOTH events
    default: op
  factionscore.command.envoy:
    description: Administer envoy events
    default: op
  factionscore.command.crate:
    description: Administer crates (bind chests, give keys, break crate chests)
    default: op
  factionscore.command.sellwand:
    description: Give sell wands
    default: op
  factionscore.kit.pvp:
    description: Access to the pvp kit
    default: op
